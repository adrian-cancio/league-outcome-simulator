name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # pyproject requires-python is ">=3.10"; pyo3 0.17 is only exercised up to 3.12.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: python -m pip install maturin pytest

      - name: Install package
        run: python -m pip install -e .[dev]

      - name: Run Python tests
        run: python -m pytest

      - name: Install linters (non-blocking)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        continue-on-error: true
        run: python -m pip install ruff basedpyright

      - name: Ruff (non-blocking)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        continue-on-error: true
        run: python -m ruff check .

      - name: Basedpyright (non-blocking)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        continue-on-error: true
        run: python -m basedpyright

      - name: Run Rust tests
        run: cargo test --release
